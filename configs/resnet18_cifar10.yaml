# Explicit historical protocol: ImageNet initialization, CIFAR-10 resized to 224.
arch: resnet18
dataset: cifar10
data_dir: datasets/cifar10
output_dir: runs/resnet18
pretrained: true
input_size: 224
epochs: 20
batch_size: 64
optimizer: adam
lr: 0.001
weight_decay: 0.0005
seed: 42
val_fraction: 0.1
device: auto
benchmark_device: cpu
pruning_ratio: 0.5
finetune_epochs: 5
qat_epochs: 5
calibration_batches: 10
quant_backend: x86
benchmark_warmup: 10
benchmark_repetitions: 50
benchmark_batch_sizes: [1, 16]
num_threads: 1
num_workers: 0
deterministic: true
