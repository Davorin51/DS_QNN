[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-qnn"
version = "0.2.0"
description = "Reproducible CNN training, pruning, CPU INT8 quantization and benchmarking"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Davorin Milicevic"}]
dependencies = [
  "torch==2.8.0", "torchvision==0.23.0", "torch-pruning>=1.6,<1.7",
  "numpy>=1.26,<3", "PyYAML>=6,<7", "pandas>=2.2,<4", "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "build>=1.2,<2"]
export = ["onnx>=1.17,<2", "onnxruntime>=1.20,<2"]

[project.scripts]
ds-qnn = "ds_qnn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore:torch.ao.quantization is deprecated:DeprecationWarning",
  "ignore:Please use quant_min and quant_max:UserWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["ds_qnn"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
