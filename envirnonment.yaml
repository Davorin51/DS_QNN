name: compress
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # tell pip about the PyTorch wheel index
      - --extra-index-url https://download.pytorch.org/whl/cu121
      # GPU wheels
      - torch==2.3.0+cu121
      - torchvision==0.18.0+cu121
      - torchaudio==2.3.0+cu121
      # the rest
      - nn-meter
      - ptflops
      - pandas
      - matplotlib
      - jupyter

