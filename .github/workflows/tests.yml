name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install matching CPU PyTorch wheels
        run: python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and validation tools
        run: python -m pip install -e '.[dev,export]'
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Regression and integration tests with coverage gate
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Offline full compression smoke workflow
        run: ds-qnn sweep --config configs/smoke.yaml --seeds 42 43 --methods struct_l1 struct_rand unstruct_mag ptq qat
      - name: Build wheel and source distribution
        run: python -m build
      - name: Upload smoke measurements and coverage
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-smoke-and-coverage
          path: |
            runs/smoke/**/result.json
            runs/smoke/**/config.json
            runs/smoke/**/environment.json
            runs/smoke/**/summary.csv
            runs/smoke/**/measurements.csv
            runs/smoke/**/*.png
            coverage.xml
          retention-days: 14
